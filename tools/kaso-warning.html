  <!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>過疎警報 - 表</title>
</head>
<body>
<div class="1">
<table>
  <tr>
    <td>レベル</td>
    <td>警報名</td>
    <td>説明</td>
  </tr>
  <tr>
    <td>0</td>
    <td>通常</td>
    <td>いつもどおりの活発時</td>
  </tr>
  <tr>
    <td>1</td>
    <td>小規模人口減少</td>
    <td>人口が少し減る</td>
  </tr>
    <tr>
    <td>2</td>
    <td>人口減少</td>
    <td>十人程人が減る</td>
  </tr>
    <tr>
    <td>3</td>
    <td>大規模人口減少</td>
    <td>数十人程減る</td>
  </tr>
    <tr>
    <td>3.5</td>
    <td>朝方大規模人口減少帯</td>
    <td>朝方で人口が大幅に減る</td>
  </tr>
    <tr>
    <td>4</td>
    <td>会話困難</td>
    <td>会話が続かない程人が減る</td>
  </tr>
    <tr>
    <td>4.5</td>
    <td>夜中会話困難帯</td>
    <td>夜中で会話が困難になる</td>
  </tr>
    <tr>
    <td>5</td>
    <td>完全無活動状態</td>
    <td>10分以上活動が少ない</td>
  </tr>
    <tr>
    <td>6</td>
    <td>崩壊状態</td>
    <td>数十分活動が無い</td>
  </tr>
  <tr>
    <td>7</td>
    <td>小規模人口減少</td>
    <td>人口が少し減る</td>
  </tr>
    <tr>
    <td>8</td>
    <td>文明崩壊</td>
    <td>活動が30分規模で少ない</td>
  </tr>
    <tr>
    <td>9</td>
    <td>絶滅状態</td>
    <td>1時間程活動が少ない</td>
  </tr>
</table>
</div>
</body>
</html>

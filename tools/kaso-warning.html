<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>過疎警報 - 表</title>

<style>
body {
  font-family: "Noto Sans JP", sans-serif;
  background: #f4f6f8;
  padding: 30px;
}

.table-container {
  max-width: 900px;
  margin: auto;
  overflow-x: auto;
  background: white;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 600px;
}

th {
  background: #2c3e50;
  color: white;
  padding: 15px;
  font-size: 18px;
}

td {
  padding: 13px;
  text-align: center;
  border-bottom: 1px solid #ddd;
}

tr:nth-child(even) {
  background: #f8f9fa;
}

tr:hover {
  background: #e8f4ff;
  transition: 0.2s;
}

/* レベル表示 */
.level {
  font-weight: bold;
  font-size: 18px;
  width: 80px;
}

/* 危険度カラー */
.lv0 { background:#d4edda; }
.lv1 { background:#e8f5e9; }
.lv2 { background:#fff3cd; }
.lv3 { background:#ffe0b2; }
.lv35 { background:#ffcc80; }
.lv4 { background:#ffb3b3; }
.lv45 { background:#ff9999; }
.lv5 { background:#ff6666; color:white; }
.lv6 { background:#d9534f; color:white; }
.lv7 { background:#c9302c; color:white; }
.lv8 { background:#8b0000; color:white; }
.lv9 { background:#000; color:white; }

</style>

</head>

<body>
<h2>開発者(プルトニウム)氏は過疎警報の発表を停止しました。</h2>
</body>
</html>
